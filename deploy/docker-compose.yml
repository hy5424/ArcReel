services:
  arcreel:
    # image: ghcr.io/arcreel/arcreel:latest
    build: ../
    ports:
      - "1241:1241"
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - ./projects:/app/projects
      - ./vertex_keys:/app/vertex_keys
      - ./claude_data:/root/.claude
      - /home/lcy/.local/bin/dreamina:/usr/local/bin/dreamina
      - /home/lcy/.dreamina:/root/.dreamina
    environment:
      - DREAMINA_CLI=/usr/local/bin/dreamina
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1241/health"]
      interval: 30s
      timeout: 5s
      retries: 3
